name: Release

# Triggered by pushing a version tag, e.g. `git tag v2.0.0 && git push --tags`.
#
# Unlike pub.dev or npm, Swift Package Manager has no package registry step:
# consumers resolve a dependency directly from a git tag
# (`.package(url: "...", from: "2.0.0")`). "Publishing" a Swift package is
# just pushing the tag — this workflow verifies the tagged commit passes
# the full quality gate, then creates a GitHub Release from that version's
# CHANGELOG.md section so the tag has human-readable release notes.

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  verify:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16'
      - uses: extractions/setup-just@v2
      - name: Install SwiftLint
        run: brew install swiftlint
      - run: just install
      - run: just format-check
      - run: just lint
      - run: just typecheck
      - run: just test

  github-release:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write # required to create a release
    steps:
      - uses: actions/checkout@v4
      - name: Extract this version's changelog section
        id: notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="$VERSION" '
            BEGIN { found=0 }
            /^## \[/ {
              if (found) exit
              if ($0 ~ "\\[" ver "\\]") { found=1; next }
            }
            /^\[.*\]:/ { if (found) exit }
            found { print }
          ' CHANGELOG.md | grep -v '^---$' > release_notes.md
      - uses: softprops/action-gh-release@v2
        with:
          body_path: release_notes.md
          generate_release_notes: false
