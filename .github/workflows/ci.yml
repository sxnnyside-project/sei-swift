name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16'
      - uses: extractions/setup-just@v2
      - name: Install SwiftLint
        run: brew install swiftlint
      - run: just install
      - run: just format-check
      - run: just lint
      - run: just typecheck
      - run: just test
